[project]
name = "convergence-with-vectors"
version = "0.1.0"
description = "Slides and code for the PyBay talk 'Convergence in vector space'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "python-dotenv",
    "rich",
    "numpy",
    "sentence-transformers",
    "torch",
    "fastapi[standard]>=0.142.2",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "black",
    "pytest",
    "pytest-playwright>=0.9.0",
]

[tool.uv]
package = false

# CPU-only torch on Linux (dev container, CI) to avoid multi-GB CUDA wheels; macOS wheels are already CPU/MPS-only
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 200
target-version = "py311"
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["D203"]

[tool.black]
line-length = 200
target-version = ["py311"]
